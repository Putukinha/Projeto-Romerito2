{% extends "base.html" %}
{% block conteudo %}

<h2>Nova Venda</h2>

{% if erro %}
    <p class="erro">{{ erro }}</p>
{% endif %}

<form method="POST">

    <label for="game">Game</label>
    <select name="game" id="game" required>
        {% for game in games %}
            <option value="{{ game.id }}">
                {{ game.nome }} - Estoque: {{ game.estoque }}
            </option>
        {% endfor %}
    </select>
    <label for="quantidade">Quantidade</label>
    <input
        type="number"
        id="quantidade"
        name="quantidade"
        required
    >
    <label for="data">Data da venda</label>
    <input
        type="text"
        id="data"
        name="data"
        placeholder="Ex.: 10/07/2026"
        required
    >
    <button type="submit">Registrar Venda</button>

</form>

{% endblock %}
