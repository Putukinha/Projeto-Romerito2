{% extends "base.html" %}
{% block conteudo %}

<h2>Editar Game</h2>

<form method="POST">

    <label>Nome</label>
    <input type="text" name="nome" value="{{ game.nome }}" required>
    <label>Plataforma</label>
    <input type="text" name="plataforma" value="{{ game.plataforma }}" required>
    <label>Preço</label>
    <input type="number" step="0.01" name="preco" value="{{ game.preco }}" required>
    <label>Estoque</label>
    <input type="number" name="estoque" value="{{ game.estoque }}" required>
    <button type="submit">Salvar Alterações</button>
    
</form>

{% endblock %}
